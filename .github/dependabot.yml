version: 2

updates:
  - package-ecosystem: composer
    directory: "/"
    schedule:
      interval: weekly
    labels:
      - "[Type] Build Tooling"
      - dependencies
      - php
    groups:
      composer-version-updates:
        applies-to: version-updates
        patterns:
          - "*"
      composer-security-updates:
        applies-to: security-updates
        patterns:
          - "*"
    ignore:
      # The WordPress test suite is not compatible with PHPUnit 10+.
      - dependency-name: phpunit/phpunit
        versions:
          - ">= 10"

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    labels:
      - "[Type] Build Tooling"
      - dependencies
      - javascript
    groups:
      npm-version-updates:
        applies-to: version-updates
        patterns:
          - "*"
      npm-security-updates:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    labels:
      - "[Type] Build Tooling"
      - github_actions
    groups:
      github-actions:
        patterns:
          - "*"
